<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Sponsor Verification</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            box-sizing: border-box;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            border-radius: 16px;
            padding: 30px 20px;
            max-width: 320px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }
        .spinner {
            border: 4px solid #334155;
            border-top: 4px solid #38bdf8;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h3 { margin: 0 0 8px 0; font-size: 20px; }
        p { color: #94a3b8; font-size: 14px; margin: 0 0 20px 0; }
        .btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            text-decoration: none;
            display: block;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="spinner" id="loader"></div>
        <h3 id="heading">🎯 Question 5 Completed!</h3>
        <p id="countdown">Sponsor verification... (5s)</p>

        <!-- 👇 YAHAN AAPKE BOT KA USERNAME AAYEGA 👇 -->
        <a id="nextBtn" class="btn" style="display: none;" href="https://t.me/Dailymcqquiz_bot?start=unlock_ad">
            Continue to Next Quiz 🚀
        </a>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        if (tg) { tg.expand(); }

        let timeLeft = 5;
        const countdownEl = document.getElementById("countdown");
        const nextBtn = document.getElementById("nextBtn");
        const loader = document.getElementById("loader");

        const timer = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
                countdownEl.innerText = `Sponsor verification... (${timeLeft}s)`;
            } else {
                clearInterval(timer);
                loader.style.display = "none";
                countdownEl.innerText = "✅ Verified!";
                nextBtn.style.display = "block";
            }
        }, 1000);
    </script>
</body>
</html>
